name: Phase 6 idempotent quiz metadata hotfix

on:
  push:
    paths:
      - '.github/workflows/phase6-idempotent-quiz-update-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch idempotent Quiz update path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          executor = Path('moodle/local_iliasmigration/classes/phase6_executor.php')
          text = executor.read_text(encoding='utf-8')
          old = '''            [, , , $moduleinfo] = get_moduleinfo_data($cm, $course);\n            $moduleinfo->name = (string) $operation['title'];\n            $moduleinfo->introeditor = $this->build_intro_editor($description);\n            update_module($moduleinfo);\n            $performed = 'UPDATED';\n            $contentimported = false;\n'''
          new = '''            $metadatachanged = (string) $quiz->name !== (string) $operation['title']\n                || (string) $quiz->intro !== $description\n                || (int) $quiz->introformat !== FORMAT_HTML;\n            if ($metadatachanged) {\n                [, , , $moduleinfo] = get_moduleinfo_data($cm, $course);\n                $moduleinfo->name = (string) $operation['title'];\n                $moduleinfo->introeditor = $this->build_intro_editor($description);\n                // Moodle Quiz form uses quizpassword; quiz_process_options() maps it back to password.\n                // Preserve the existing value so a metadata-only update never writes password=NULL.\n                $moduleinfo->quizpassword = (string) $quiz->password;\n                update_module($moduleinfo);\n            }\n            $performed = 'UPDATED';\n            $contentimported = false;\n'''
          if old not in text:
              raise SystemExit('Quiz UPDATE metadata block not found')
          text = text.replace(old, new, 1)
          executor.write_text(text, encoding='utf-8')

          version = Path('moodle/local_iliasmigration/version.php')
          v = version.read_text(encoding='utf-8')
          v = v.replace('$plugin->version = 2026090522;', '$plugin->version = 2026090523;')
          v = v.replace("$plugin->release = '0.12.5-alpha';", "$plugin->release = '0.12.6-alpha';")
          version.write_text(v, encoding='utf-8')

          test = Path('tests/test_phase6_quiz_idempotent_metadata_update.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_phase6_identical_quiz_replay_skips_metadata_write_and_preserves_password():\n    source = Path(\n        "moodle/local_iliasmigration/classes/phase6_executor.php"\n    ).read_text(encoding="utf-8")\n    assert "$metadatachanged = (string) $quiz->name" in source\n    assert "if ($metadatachanged) {" in source\n    assert "$moduleinfo->quizpassword = (string) $quiz->password;" in source\n    metadata_pos = source.index("$metadatachanged = (string) $quiz->name")\n    update_pos = source.index("update_module($moduleinfo);", metadata_pos)\n    guard_pos = source.index("if ($metadatachanged) {", metadata_pos)\n    assert metadata_pos < guard_pos < update_pos\n''', encoding='utf-8')
          PY
      - name: Validate PHP syntax
        run: php -l moodle/local_iliasmigration/classes/phase6_executor.php
      - name: Commit and push hotfix
        shell: bash
        run: |
          git config user.name 'Vince'
          git config user.email '61915948+vincent-sayah@users.noreply.github.com'
          git add moodle/local_iliasmigration/classes/phase6_executor.php \
                  moodle/local_iliasmigration/version.php \
                  tests/test_phase6_quiz_idempotent_metadata_update.py
          git commit -m 'Make Phase 6 Quiz replay metadata update idempotent'
          git push origin HEAD:main
