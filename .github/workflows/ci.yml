name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP version
        run: php -v

      - name: PHP syntax
        run: find moodle/local_iliasmigration -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Phase 2 deep-folder policy regression
        run: php tests/php/test_folder_flattener.php

      - name: Phase 2 category-path policy regression
        run: php tests/php/test_category_path_resolver.php

      - name: Phase 3 synthetic-section update regression
        run: php tests/php/test_phase3_section_policy.php

      - name: Phase 3 internal-link rewrite regression
        run: php tests/php/test_phase3_internal_link_policy.php

      - name: Phase 6.5 Content Page renderer regression
        run: php tests/php/test_phase65_content_renderer.php

      - name: Phase 6.5 Glossary renderer regression
        run: php tests/php/test_phase65_glossary_renderer.php
