name: Phase 6 ordering XML hotfix

on:
  push:
    paths:
      - '.github/workflows/phase6-ordering-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Ordering XML and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php')
          text = builder.read_text(encoding='utf-8')
          needle = '        $xml .= "    <numberingstyle>none</numberingstyle>\\n";\n'
          replacement = needle + (
              '        // Moodle Ordering import creates default hint options when shownumcorrect is absent;\\n'
              '        // make it explicit so question_hints.hintformat is never inferred as NULL.\\n'
              '        $xml .= "    <shownumcorrect>1</shownumcorrect>\\n";\n'
          )
          if needle not in text:
              raise SystemExit('Ordering numberingstyle insertion point not found')
          if '<shownumcorrect>1</shownumcorrect>' not in text:
              text = text.replace(needle, replacement, 1)
              builder.write_text(text, encoding='utf-8')

          version = Path('moodle/local_iliasmigration/version.php')
          v = version.read_text(encoding='utf-8')
          v = v.replace('$plugin->version = 2026090518;', '$plugin->version = 2026090519;')
          v = v.replace("$plugin->release = '0.12.1-alpha';", "$plugin->release = '0.12.2-alpha';")
          version.write_text(v, encoding='utf-8')

          test = Path('tests/test_phase6_ordering_moodle_xml.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_ordering_xml_sets_shownumcorrect_before_feedback():\n    source = Path(\n        "moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php"\n    ).read_text(encoding="utf-8")\n    start = source.index("private function render_ordering")\n    end = source.index("/** Native equal-weight Matching", start)\n    method = source[start:end]\n    marker = "<shownumcorrect>1</shownumcorrect>"\n    assert marker in method\n    assert method.index(marker) < method.index("<correctfeedback")\n''', encoding='utf-8')
          PY
      - name: Validate PHP syntax
        run: php -l moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php
      - name: Commit and push hotfix
        shell: bash
        run: |
          git config user.name 'Vince'
          git config user.email '61915948+vincent-sayah@users.noreply.github.com'
          git add moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php \
                  moodle/local_iliasmigration/version.php \
                  tests/test_phase6_ordering_moodle_xml.py
          git commit -m 'Fix Phase 6 Ordering XML hint defaults'
          git push origin HEAD:main
