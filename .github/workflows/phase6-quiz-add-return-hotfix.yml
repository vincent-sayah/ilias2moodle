name: Phase 6 quiz add return hotfix

on:
  push:
    paths:
      - '.github/workflows/phase6-quiz-add-return-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Moodle quiz_add_quiz_question return handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          executor = Path('moodle/local_iliasmigration/classes/phase6_executor.php')
          text = executor.read_text(encoding='utf-8')
          old = '                if (!quiz_add_quiz_question($qid, $quiz, 0, $maxmark)) {\n'
          new = '                if (quiz_add_quiz_question($qid, $quiz, 0, $maxmark) === false) {\n'
          if old not in text:
              raise SystemExit('quiz_add_quiz_question condition not found')
          text = text.replace(old, new, 1)
          executor.write_text(text, encoding='utf-8')

          version = Path('moodle/local_iliasmigration/version.php')
          v = version.read_text(encoding='utf-8')
          v = v.replace('$plugin->version = 2026090520;', '$plugin->version = 2026090521;')
          v = v.replace("$plugin->release = '0.12.3-alpha';", "$plugin->release = '0.12.4-alpha';")
          version.write_text(v, encoding='utf-8')

          test = Path('tests/test_phase6_quiz_add_return.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_quiz_add_quiz_question_only_treats_false_as_failure():\n    source = Path(\n        "moodle/local_iliasmigration/classes/phase6_executor.php"\n    ).read_text(encoding="utf-8")\n    expected = (\n        "if (quiz_add_quiz_question($qid, $quiz, 0, $maxmark) === false)"\n    )\n    assert expected in source\n    assert "if (!quiz_add_quiz_question($qid, $quiz, 0, $maxmark))" not in source\n''', encoding='utf-8')
          PY
      - name: Validate PHP syntax
        run: php -l moodle/local_iliasmigration/classes/phase6_executor.php
      - name: Commit and push hotfix
        shell: bash
        run: |
          git config user.name 'Vince'
          git config user.email '61915948+vincent-sayah@users.noreply.github.com'
          git add moodle/local_iliasmigration/classes/phase6_executor.php \
                  moodle/local_iliasmigration/version.php \
                  tests/test_phase6_quiz_add_return.py
          git commit -m 'Fix Phase 6 quiz slot add return handling'
          git push origin HEAD:main
