name: Phase 6 ordering XML hotfix 2

on:
  push:
    paths:
      - '.github/workflows/phase6-ordering-hotfix2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix malformed Ordering XML source line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          builder = Path('moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php')
          text = builder.read_text(encoding='utf-8')
          start_marker = '        $xml .= "    <numberingstyle>none</numberingstyle>\\n";\n'
          end_marker = '        $xml .= "    <correctfeedback format=\\"html\\"><text></text></correctfeedback>\\n";\n'
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '        // Moodle Ordering import creates default hint options when shownumcorrect is absent.\n'
              '        // Make it explicit so question_hints.hintformat is never inferred as NULL.\n'
              '        $xml .= "    <shownumcorrect>1</shownumcorrect>\\n";\n'
          )
          text = text[:start] + replacement + text[end:]
          builder.write_text(text, encoding='utf-8')

          version = Path('moodle/local_iliasmigration/version.php')
          v = version.read_text(encoding='utf-8')
          v = v.replace('$plugin->version = 2026090519;', '$plugin->version = 2026090520;')
          v = v.replace("$plugin->release = '0.12.2-alpha';", "$plugin->release = '0.12.3-alpha';")
          version.write_text(v, encoding='utf-8')

          test = Path('tests/test_phase6_ordering_moodle_xml.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_ordering_xml_sets_shownumcorrect_as_executable_statement():\n    source = Path(\n        "moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php"\n    ).read_text(encoding="utf-8")\n    start = source.index("private function render_ordering")\n    end = source.index("/** Native equal-weight Matching", start)\n    method = source[start:end]\n    lines = [line.strip() for line in method.splitlines()]\n    statement = '$xml .= "    <shownumcorrect>1</shownumcorrect>\\\\n";'\n    assert statement in lines\n    assert all(not line.startswith("//") or statement not in line for line in lines)\n    assert method.index("<shownumcorrect>1</shownumcorrect>") < method.index("<correctfeedback")\n''', encoding='utf-8')
          PY
      - name: Validate PHP syntax
        run: php -l moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php
      - name: Commit and push hotfix
        shell: bash
        run: |
          git config user.name 'Vince'
          git config user.email '61915948+vincent-sayah@users.noreply.github.com'
          git add moodle/local_iliasmigration/classes/phase6_moodle_xml_builder.php \
                  moodle/local_iliasmigration/version.php \
                  tests/test_phase6_ordering_moodle_xml.py
          git commit -m 'Fix executable Phase 6 Ordering shownumcorrect XML'
          git push origin HEAD:main
