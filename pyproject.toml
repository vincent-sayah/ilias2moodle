[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ilias2moodle"
version = "0.1.0"
description = "Migration semi-automatisée de contenus ILIAS 10 vers Moodle 4.5"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vincent Sayah" }
]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.3,<7",
  "python-dotenv>=1.0,<2",
  "requests>=2.32,<3",
  "zeep>=4.3,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1"
]

[project.scripts]
ilias2moodle = "ilias2moodle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
